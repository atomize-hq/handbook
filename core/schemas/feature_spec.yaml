$schema: "https://json-schema.org/draft/2020-12/schema"
title: WorkSpecification
type: object
required:
  - schema_id
  - schema_version
  - record_id
  - objective
  - scope
  - non_goals
  - acceptance_criteria
  - status
properties:
  schema_id:
    const: handbook.artifact.work-specification
  schema_version:
    const: "1.0"
  record_id:
    type: string
    minLength: 3
    maxLength: 255
    pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*(?:\\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*)+$"
  objective:
    type: string
    minLength: 1
    maxLength: 8192
  scope:
    type: array
    minItems: 1
    maxItems: 64
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 256
  non_goals:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 256
  acceptance_criteria:
    type: array
    minItems: 1
    maxItems: 64
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 256
  status:
    enum: [draft, review_ready, approved, active, completed, cancelled]
additionalProperties: false
unevaluatedProperties: false
