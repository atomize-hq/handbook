[package]
name = "membership-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
immutable-chunkmap = { version = "=2.1.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
