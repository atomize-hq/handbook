[package]
name = "file-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Opaque immutable indexed records with recoverable native publication and bounded maintenance."

[lib]
name = "file_native"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
