[package]
name = "handbook-tauri"
version = "0.1.0"
edition = "2021"
description = "Non-UI Tauri command adapter for the Handbook SDK."
repository = "https://github.com/atomize-hq/system.git"
documentation = "https://docs.rs/handbook-tauri"
homepage = "https://github.com/atomize-hq/system.git"
license = "MIT"

[lib]
name = "handbook_tauri"
path = "src/lib.rs"

[dependencies]
handbook-sdk = { path = "../sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", default-features = false }

[dev-dependencies]
handbook-contracts = { path = "../contracts", version = "0.1.0" }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
tempfile = "3"
