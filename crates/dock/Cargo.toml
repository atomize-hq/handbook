[package]
name = "handbook-dock"
version = "0.1.0"
edition = "2021"
description = "Operational process protocol and execution records for Handbook docks."
repository = "https://github.com/atomize-hq/system.git"
documentation = "https://docs.rs/handbook-dock"
homepage = "https://github.com/atomize-hq/system.git"
license = "MIT"

[lib]
name = "handbook_dock"
path = "src/lib.rs"

[[bin]]
name = "dock-test-helper"
path = "test-support/native_helper.rs"
required-features = ["test-support"]
test = false
doc = false

[features]
test-support = []

[dependencies]
handbook-contracts = { path = "../contracts", version = "0.1.0" }
handbook-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
tempfile = "3"
