[package]
name = "handbook-contracts"
version = "0.1.0"
edition = "2021"
description = "Contract definition, claim, applicability, and lifecycle semantics for Handbook."
repository = "https://github.com/atomize-hq/system.git"
documentation = "https://docs.rs/handbook-contracts"
homepage = "https://github.com/atomize-hq/system.git"
license = "MIT"

[lib]
name = "handbook_contracts"
path = "src/lib.rs"

[dependencies]
handbook-engine = { path = "../engine" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"

[dev-dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
tempfile = "3"
